    .frame::after {
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(0, 0, 0, 0.32), rgba(4, 4, 5, 0.08) 42%, rgba(0, 0, 0, 0.72)),
        radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, 0.4) 100%);
    }

    .content {
      display: flex;
      width: min(92vw, 470px);
      flex-direction: column;
      align-items: center;
      padding: 28px 20px;
      text-align: center;
      animation: rise 0.8s ease-out both;
    }

    .kicker {
      margin: 0 0 9px;
      color: #ffb4b5;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(1.75rem, 9vw, 4.75rem);
      font-weight: 900;
      letter-spacing: 0.13em;
      line-height: 1;
      text-indent: 0.13em;
      text-shadow: 0 0 13px rgba(242, 56, 61, 0.8), 0 0 42px rgba(242, 56, 61, 0.42);
    }

    .rule {
      width: 52px;
      height: 2px;
      margin: 19px auto 24px;
      background: var(--red);
      box-shadow: 0 0 12px var(--red);
    }

    .player {
      width: min(100%, 330px);
      margin: 0 auto;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.42);
    }

    .player iframe {
      display: block;
      width: 100%;
      margin-inline: auto;
      height: 80px;
      border: 0;
      border-radius: 12px;
    }

    .footer {
      position: absolute;
      right: 12px;
      bottom: max(14px, env(safe-area-inset-bottom));
      left: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-align: center;
      text-shadow: 0 1px 5px #000;
    }

    .footer-flag {
      font-size: 14px;
      line-height: 1;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 360px) {
      .content {
        width: 100vw;
        padding-right: 0;
        padding-left: 0;
      }

      .player {
        width: min(330px, max(280px, calc(100vw - 16px)));
      }

      .kicker {
        font-size: 9px;
        letter-spacing: 0.32em;
      }

    }

    @media (max-height: 430px) {
      .content {
        padding-top: 10px;
        padding-bottom: 26px;
      }

      .kicker {
        margin-bottom: 6px;
      }

      h1 {
        font-size: clamp(1.75rem, 8vw, 3.5rem);
      }

      .rule {
        margin: 12px auto 15px;
      }

    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="frame">
    <section class="content" aria-label="Xatframe de MANIATICO">
      <p class="kicker">Bienvenido a mi espacio</p>
      <h1>MANIATICO</h1>
      <div class="rule" aria-hidden="true"></div>

      <section class="player" aria-label="Reproductor de Spotify">
        <iframe
          src="https://open.spotify.com/embed/track/2DlHlPMa4M17kufBvI2lEN?utm_source=generator&theme=0"
          width="100%"
          height="80"
          frameborder="0"
          allowfullscreen
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy"
          title="Reproductor de Spotify">
        </iframe>
      </section>
    </section>

    <footer class="footer">
      <span class="footer-flag" id="visitorFlag" aria-hidden="true"></span>
      <span>Ubicacion: <span id="visitorCountry">Desconocida</span></span>
    </footer>
  </main>

  <script>
    const visitorCountry = document.getElementById("visitorCountry");
    const visitorFlag = document.getElementById("visitorFlag");

    fetch("https://ipapi.co/json/", { referrerPolicy: "no-referrer" })
      .then((response) => {
        if (!response.ok) throw new Error("Geolocation request failed");
        return response.json();
      })
      .then((location) => {
        const countryCode = (location.country_code_iso3 || "").toUpperCase();
        const flagCode = (location.country_code || location.country || "").toUpperCase();

        if (countryCode) visitorCountry.textContent = countryCode;
        if (!/^[A-Z]{2}$/.test(flagCode)) return;

        visitorFlag.textContent = String.fromCodePoint(
          ...[...flagCode].map((letter) => 127397 + letter.charCodeAt(0)),
        );
      })
      .catch(() => {
        visitorCountry.textContent = "Desconocida";
        visitorFlag.textContent = "";
      });
  </script>
</body>
</html>
